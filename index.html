<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Filmes</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #f5f5f5;
            --accent-color: #e50914;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #000;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid var(--accent-color);
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 25px rgba(229, 9, 20, 0.3);
        }

        .card-img {
            width: 100%;
            height: 400px;
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #777;
            /* Placeholder pattern if no image is loaded */
            background-image: repeating-linear-gradient(45deg, #222 25%, transparent 25%, transparent 75%, #222 75%, #222), repeating-linear-gradient(45deg, #222 25%, #333 25%, #333 75%, #222 75%, #222);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
        }

        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
        }

        .card-title {
            margin: 0 0 10px 0;
            font-size: 1.3rem;
            color: var(--accent-color);
        }

        .card-synopsis {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #ccc;
        }
    </style>
</head>
<body>

    <header>
        <h1>Minha Coleção Épica</h1>
    </header>

    <div class="container">
        <div class="grid" id="movieGrid">
            <!-- Os filmes serão injetados aqui pelo JavaScript -->
        </div>
    </div>

    <script>
        // Lista de filmes com títulos e sinopses
        const movies = [
            { title: "O Poderoso Chefão", synopsis: "A história da família mafiosa Corleone e a ascensão de Michael Corleone." },
            { title: "A Lista de Schindler", synopsis: "Oskar Schindler gasta sua fortuna para salvar judeus no Holocausto." },
            { title: "Interestelar ", synopsis: "Exploradores viajam por um buraco de minhoca para salvar a humanidade." },
            { title: "Cidade de Deus ", synopsis: "O crescimento da violência em uma favela, visto por um jovem fotógrafo." },
            { title: "Matrix", synopsis: "Um hacker descobre a verdadeira natureza de sua realidade." },
            { title: "De Volta para o Futuro", synopsis: "Um adolescente viaja acidentalmente no tempo para o ano de 1955." },
            { title: "Batman: O Cavaleiro das Trevas", synopsis: "Batman enfrenta o Coringa, um criminoso caótico e imprevisível." },
            { title: "Star Wars: Ep IV - Uma Nova Esperança", synopsis: "Luke Skywalker se une a uma rebelião para destruir a Estrela da Morte." },
            { title: "Velozes e Furiosos", synopsis: "O início da saga de corridas de rua e a formação da 'família' de Toretto." },
            { title: "+ Velozes + Furiosos", synopsis: "Brian O'Conner se infiltra no crime organizado em Miami." },
            { title: "Velozes e Furiosos 4 ", synopsis: "Dom e Brian se reúnem para derrubar um cartel de drogas." },
            { title: "Velozes e Furiosos 5: Operação Rio", synopsis: "A equipe planeja um assalto milionário no Rio de Janeiro." },
        ];

        const grid = document.getElementById('movieGrid');

        // Função para criar os cartões dinamicamente
        movies.forEach(movie => {
            const card = document.createElement('div');
            card.className = 'card';
            
            // Você pode adicionar links reais de imagens na tag <img> se desejar.
            // Atualmente, usa um espaço estilizado caso não haja imagem.
            card.innerHTML = `
                <div class="card-img">
                    <span style="padding: 20px; text-align: center;">Imagem Indisponível<br><small>(Adicione a URL no código)</small></span>
                </div>
                <div class="card-content">
                    <h2 class="card-title">${movie.title}</h2>
                    <p class="card-synopsis">${movie.synopsis}</p>
                </div>
            `;
            
            grid.appendChild(card);
        });
    </script>
</body>
</html>
